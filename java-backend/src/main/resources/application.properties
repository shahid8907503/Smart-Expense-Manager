server.port=8080
spring.application.name=Smart-Expense-Java-FullStack

# H2 In-Memory / File SQL Database (Spring Data JPA / Hibernate)
spring.datasource.url=jdbc:h2:file:./data/smart_expense_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Inspect SQL tables at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

